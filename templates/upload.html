{% extends "base.html" %}
{% block title %}Upload data{% endblock %}

{% block content %}
<div class="card">
    <h1>Upload customer data</h1>
    <p class="muted">Choose a .csv or .xlsx file with InvoiceNo, CustomerID, Quantity, UnitPrice and InvoiceDate columns. Large files can take 1 to 2 minutes the first time.</p>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept=".csv,.xlsx">
        <button class="btn" type="submit">Upload and analyse</button>
    </form>
</div>
{% endblock %}
