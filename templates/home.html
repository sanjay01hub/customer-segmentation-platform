<!DOCTYPE html>
<html>
<head>
    <title>Customer Segmentation Platform</title>
</head>
<body>
    <h1>Customer Segmentation Platform</h1>
    <p>Upload customer data and get behavior-based segments.</p>

    {% if current_user.is_authenticated %}
        <p>Logged in as {{ current_user.email }}</p>
        <p><a href="{{ url_for('upload') }}">Upload a file</a> |
           <a href="{{ url_for('history') }}">My analyses</a> |
           <a href="{{ url_for('logout') }}">Log out</a></p>
    {% else %}
        <p><a href="{{ url_for('login') }}">Log in</a> |
           <a href="{{ url_for('register') }}">Register</a></p>
    {% endif %}
</body>
</html>
