{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-grid">
    <div class="card">
        <h1>Log in</h1>
        <form method="POST">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button class="btn" type="submit">Log in</button>
        </form>
        <p class="muted">No account yet? <a href="{{ url_for('register') }}">Register</a></p>
    </div>
    {% include "_learn.html" %}
</div>
{% endblock %}
